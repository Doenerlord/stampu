name: Daily Stamp Rally Discovery & Live Sync

on:
  schedule:
    # Runs every morning at 04:00 JST (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-rallies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stamp Rally Discovery Monitor
        run: |
          python3 scraper/monitor_new_rallies.py

      - name: Commit and push changes if new rallies detected
        run: |
          if [ -n "$(git status --porcelain public/data/rallies.json)" ]; then
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/rallies.json
            git commit -m "feat(rallies): auto-sync new active Japanese stamp rallies [skip ci]"
            git push
            echo "Successfully committed and pushed updated rallies.json to repository."
          else
            echo "No new stamp rallies detected today. Skipping commit."
          fi
