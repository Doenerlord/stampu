<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Traditional Japanese Hanko Commemorative Seal -->
  <defs>
    <filter id="hanko-rough-michi-michi-211" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#hanko-rough-michi-michi-211)" transform="rotate(1.28 200 200)">
    <!-- Outer Decorative Concentric Rings -->
    <circle cx="200" cy="200" r="185" fill="none" stroke="#9a3412" stroke-width="7" stroke-dasharray="18 6" />
    <circle cx="200" cy="200" r="172" fill="none" stroke="#9a3412" stroke-width="2.5" />
    <circle cx="200" cy="200" r="148" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>

    <!-- Category Header Ribbon -->
    <text x="200" y="86" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="bold" font-size="20" fill="#9a3412" text-anchor="middle" letter-spacing="5">全国道の駅 登録記念</text>

    <!-- Top Traditional Divider Bar -->
    <line x1="85" y1="108" x2="315" y2="108" stroke="#9a3412" stroke-width="2.5" stroke-dasharray="8 4" />
    <circle cx="200" cy="108" r="4" fill="#9a3412" />

    <!-- Flanking Decorative Brackets -->
    <text x="75" y="198" font-family="'Noto Serif JP', serif" font-weight="bold" font-size="24" fill="#9a3412" text-anchor="middle">〔</text>
    <text x="325" y="198" font-family="'Noto Serif JP', serif" font-weight="bold" font-size="24" fill="#9a3412" text-anchor="middle">〕</text>

    <!-- Stamp Japanese Name (Kanji / Calligraphy) -->
    <text x="200" y="180" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="900" font-size="30" fill="#9a3412" text-anchor="middle" letter-spacing="3">さんさん</text>
    <text x="200" y="222" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="900" font-size="30" fill="#9a3412" text-anchor="middle" letter-spacing="3">南三陸</text>

    <!-- Bottom Traditional Divider Bar -->
    <line x1="85" y1="262" x2="315" y2="262" stroke="#9a3412" stroke-width="2.5" stroke-dasharray="8 4" />
    <circle cx="200" cy="262" r="4" fill="#9a3412" />

    <!-- Subtitle (Prefecture & Location) -->
    <text x="200" y="292" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif" font-weight="bold" font-size="15" fill="#9a3412" text-anchor="middle" letter-spacing="2">Miyagi • Miyagi Roadside</text>

    <!-- Bottom Commemorative Seal Cartouche -->
    <rect x="135" y="318" width="130" height="32" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="2.5" />
    <text x="200" y="340" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-weight="900" font-size="15" fill="#9a3412" text-anchor="middle" letter-spacing="5">来駅記念</text>
  </g>
</svg>