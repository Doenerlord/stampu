<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="ink-bleed-temple-shikoku-37" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g transform="rotate(-1.76 200 200)" filter="url(#ink-bleed-temple-shikoku-37)">
    <!-- Outer Seal Frame -->
    <circle cx="200" cy="200" r="185" fill="#fef2f2" stroke="#991b1b" stroke-width="9" />
    <circle cx="200" cy="200" r="172" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.85" />
    <circle cx="200" cy="200" r="148" fill="none" stroke="#991b1b" stroke-width="3" />

    <!-- Circuit Top Badge Banner -->
    <rect x="70" y="72" width="260" height="34" rx="17" fill="#991b1b" opacity="0.95" />
    <text x="200" y="95" font-family="Hiragino Sans, Meiryo, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">四国第37番 霊場巡礼</text>

    <!-- Main Temple / Rest Stop Name -->
    <text x="200" y="215" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="46" font-weight="900" fill="#991b1b" text-anchor="middle" letter-spacing="4">岩本寺</text>

    <!-- Bottom Location Pill -->
    <rect x="90" y="295" width="220" height="28" rx="14" fill="#991b1b" opacity="0.12" />
    <text x="200" y="314" font-family="Hiragino Sans, Meiryo, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle" letter-spacing="2">Kochi • 四万十町</text>

    <!-- Traditional Hanko Corner Seal -->
    <rect x="290" y="235" width="46" height="46" rx="6" fill="none" stroke="#991b1b" stroke-width="2.5" />
    <text x="313" y="265" font-family="Hiragino Mincho ProN, serif" font-size="16" font-weight="900" fill="#991b1b" text-anchor="middle">同行二人</text>
  </g>
</svg>