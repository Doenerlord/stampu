<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="f-airport-ishigaki" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
  <g transform="rotate(-0.5 200 200)" filter="url(#f-airport-ishigaki)">
    <circle cx="200" cy="200" r="186" fill="#fffaf5" stroke="#4f46e5" stroke-width="7" />
    <circle cx="200" cy="200" r="174" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-dasharray="8 3" />
    <circle cx="200" cy="200" r="136" fill="none" stroke="#4f46e5" stroke-width="1.8" />
    <path id="arch-top-airport-ishigaki" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
    <text font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="18" font-weight="bold" fill="#4f46e5" letter-spacing="4">
      <textPath href="#arch-top-airport-ishigaki" startOffset="50%" text-anchor="middle">
        ★ 全国空港・御翔印 ★
      </textPath>
    </text>
    <path id="arch-bot-airport-ishigaki" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />
    <text font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="15" font-weight="bold" fill="#4f46e5" letter-spacing="3">
      <textPath href="#arch-bot-airport-ishigaki" startOffset="50%" text-anchor="middle">
        Okinawa • Ishigaki
      </textPath>
    </text>
    <text x="200" y="210" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="28" font-weight="900" fill="#4f46e5" text-anchor="middle" letter-spacing="2">新石垣空港 </text>
    <g transform="translate(160, 260)">
      <rect x="0" y="0" width="80" height="24" rx="4" fill="none" stroke="#4f46e5" stroke-width="2" />
      <text x="40" y="17" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="12" font-weight="bold" fill="#4f46e5" text-anchor="middle" letter-spacing="2">記念印</text>
    </g>
  </g>
</svg>