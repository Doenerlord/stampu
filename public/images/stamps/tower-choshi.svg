<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="f-tower-choshi" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g transform="rotate(0.88 200 200)" filter="url(#f-tower-choshi)">
    <!-- Outer Octagon / Double Ring Seal -->
    <circle cx="200" cy="200" r="186" fill="#f0f9ff" stroke="#0284c7" stroke-width="7" />
    <circle cx="200" cy="200" r="174" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-dasharray="8 3" />
    <circle cx="200" cy="200" r="136" fill="none" stroke="#0284c7" stroke-width="1.8" />

    <!-- Top Arch / Circuit Banner -->
    <path id="arch-top-tower-choshi" d="M 50,200 A 150,150 0 0,1 350,200" fill="none" />
    <text font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="19" font-weight="bold" fill="#0284c7" letter-spacing="5">
      <textPath href="#arch-top-tower-choshi" startOffset="50%" text-anchor="middle">
        ★ 全日本タワー連盟 登頂記念 ★
      </textPath>
    </text>

    <!-- Bottom Arch / Location -->
    <path id="arch-bot-tower-choshi" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />
    <text font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="15" font-weight="bold" fill="#0284c7" letter-spacing="4">
      <textPath href="#arch-bot-tower-choshi" startOffset="50%" text-anchor="middle">
        Chiba • 銚子市
      </textPath>
    </text>

    <!-- Center Shrine/Temple Seal -->
    <g>
      <text x="200" y="195" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="28" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="3">銚子ポー</text>
      <text x="200" y="240" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="28" font-weight="900" fill="#0284c7" text-anchor="middle" letter-spacing="3">トタワー</text>
    </g>

    <!-- Spiritual Corner Emblem / Kan'in Box -->
    <g transform="translate(160, 276)">
      <rect x="0" y="0" width="80" height="26" rx="5" fill="none" stroke="#0284c7" stroke-width="2" />
      <text x="40" y="18" font-family="Hiragino Mincho ProN, Yu Mincho, serif" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle" letter-spacing="4">展望登頂</text>
    </g>
  </g>
</svg>